name: Deploy WASM Tournament Dashboard

"on":
    push:
        branches:
            - main

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: "pages"
    cancel-in-progress: true

jobs:
    build-and-deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Stage Production Web Artifacts
              run: |
                  if [ -d "public" ] && [ ! -d "docs/public" ]; then cp -r public docs/; fi

                  if [ -d "data/raw" ]; then
                    mkdir -p docs/data/raw
                    cp data/raw/results.csv docs/data/raw/ || true
                    cp data/raw/shootouts.csv docs/data/raw/ || true
                    cp data/raw/annex_c_matrix.json docs/data/raw/ || true
                  fi
                  touch docs/.nojekyll

            - name: Upload Clean Web Bundle
              uses: actions/upload-pages-artifact@v3
              with:
                  path: ./docs

            - name: Deploy Isolated Payload to Pages API
              id: deployment
              uses: actions/deploy-pages@v4
