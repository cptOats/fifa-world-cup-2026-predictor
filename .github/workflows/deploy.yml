name: Deploy WASM Tournament Dashboard

"on":
    push:
        branches:
            - main

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: "pages"
    cancel-in-progress: true

jobs:
    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Prepare Clean Artifact & Fix Permissions
              run: |
                  mkdir -p docs

                  if [ -d "public" ] && [ ! -d "docs/public" ]; then
                    cp -rL public docs/
                  fi

                  touch docs/.nojekyll
                  chmod -R a+rX docs/

            - name: Upload Clean Web Bundle
              uses: actions/upload-pages-artifact@v3
              with:
                  path: ./docs

            - name: Deploy Isolated Payload to Pages API
              id: deployment
              uses: actions/deploy-pages@v4
